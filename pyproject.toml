[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "looped-paper"
version = "0.1.0"
description = "Algorithmic-task experiments for learned stochastic stopping in looped transformers"
requires-python = ">=3.9,<3.12"
dependencies = [
  "torch==2.1.2",
  "numpy==1.24.1",
  "transformers==4.17.0",
  "tokenizers==0.15.2",
  "huggingface-hub==0.22.2",
]

[project.scripts]
looped-paper = "looped_paper.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
